<style>
:root{--bg:#02040d;--paper:#eef3ff;--blue:#2f7bff}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.hero{touch-action:pinch-zoom;position:relative;height:100%;min-height:600px;contain:paint;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;padding:clamp(20px,3vw,44px)}
canvas{position:absolute;inset:0;width:100%;height:100%;animation:fade 2.4s .1s both}
.no-gl #g{display:none}
.no-gl .hero{background:radial-gradient(circle at 84% 105%,#0d2f8f 0,#071a52 30%,#02040d 52%)}
#n{animation-delay:1s}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(2,4,13,.6),rgba(2,4,13,.15) 52%,transparent 70%),linear-gradient(to top,rgba(2,4,13,.4),transparent 38%)}
header,main{position:relative;z-index:2}
header{display:flex;justify-content:space-between;align-items:center;animation:fade 1s .3s both}
.logo img{height:clamp(40px,4.6vw,54px);width:auto;display:block}
.pill{padding:.85rem 2rem;border:1px solid rgba(238,243,255,.35);border-radius:99px;color:var(--paper);text-decoration:none;font-weight:600;font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(2,4,13,.35);backdrop-filter:blur(8px);transition:background .3s,color .3s}
.pill:hover{background:var(--paper);color:#02040d}
main{margin-top:auto}
h1{margin:0;text-wrap:balance;font-weight:800;font-size:clamp(2.4rem,6.8vw,8.2rem);line-height:.96;letter-spacing:-.035em;text-transform:uppercase;filter:drop-shadow(0 0 28px rgba(30,80,255,.3))}
.l{display:block;overflow:hidden;padding:.04em 0 .1em;margin-bottom:-.1em}
.l>span{display:block;transform:translateY(108%);animation:rise 1.3s cubic-bezier(.16,1,.3,1) forwards}
.l:nth-child(1)>span{animation-delay:.6s}
.l:nth-child(2)>span{animation-delay:.78s}
h1 em{font-style:normal;background:linear-gradient(180deg,#6aaeff,#1f5bff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 b{font-weight:800;color:#2f7bff}
.bottom{margin-top:clamp(1.2rem,3vw,2.4rem);animation:up 1s 1.35s both}
.bottom p{margin:0;max-width:30ch;font-size:clamp(.95rem,1.35vw,1.3rem);line-height:1.5;letter-spacing:.08em;text-transform:uppercase;color:rgba(200,214,240,.88);text-shadow:0 1px 16px rgba(2,4,13,.9)}
.cta{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:clamp(1.2rem,2.6vw,2.2rem)}
.btn{display:inline-flex;align-items:center;gap:.8rem;padding:1.15rem 2.1rem;border-radius:99px;font-size:.95rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:transform .25s ease-out,background .3s,box-shadow .3s}
.solid{background:linear-gradient(180deg,#2c5cff,#1b45f2);color:#fff;box-shadow:0 10px 44px rgba(30,80,255,.45)}
.solid:hover{box-shadow:0 10px 60px rgba(50,110,255,.75)}
.ghost{border:1px solid rgba(238,243,255,.28);color:var(--paper);background:rgba(2,4,13,.35);backdrop-filter:blur(8px)}
.ghost:hover{background:rgba(238,243,255,.1)}
a:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.solid:focus-visible{outline-color:#9fc0ff}
.btn:active{filter:brightness(.92)}
svg{transition:transform .25s ease-out}
.btn:hover svg{transform:translateX(4px)}
.ai{position:absolute;z-index:2;left:clamp(20px,3vw,44px);top:clamp(96px,16vh,150px);width:min(480px,42vw);padding:18px 22px 20px;border-radius:20px;border:1px solid rgba(238,243,255,.13);background:rgba(6,12,32,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:clamp(.78rem,1vw,.92rem);line-height:1.6;animation:up 1s 1.7s both}
.ai-h{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,243,255,.66)}
.ai-h i{width:10px;height:10px;border-radius:50%;background:#2f6bff;box-shadow:0 0 12px #2f6bff;animation:pulse 1.6s ease-in-out infinite}
.ai-h b{margin-left:auto;font-weight:400;font-variant-numeric:tabular-nums}
.ai-q{min-height:1.6em;color:var(--paper)}
.ai-q::before{content:'\203A  ';color:rgba(238,243,255,.6)}
.ai-a{min-height:3.4em;margin-top:.7rem;color:#9fc0ff}
.ai-c{display:inline-block;width:.6em;height:1.05em;margin-left:3px;vertical-align:-.15em;background:#2f6bff;animation:blink 1s steps(1) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{to{transform:none}}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:820px){.ai{display:none}}
@media (max-width:480px){.btn{padding:1rem 1.6rem;font-size:.85rem}.pill{padding:.7rem 1.4rem;font-size:.8rem}.bottom p{letter-spacing:.06em}}
@media (max-height:700px){.ai{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
